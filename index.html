<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanush Maloo</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 3rem 1.5rem;
    }

    main {
      max-width: 1100px;
      width: 100%;
    }

    h1 {
      font-size: clamp(1.4rem, 2.8vw, 2.8rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: #d4d4db;
    }

    h1 .line { display: block; }

    h1 .eng,
    h1 .con {
      font-weight: 900;
      font-size: 1.25em;
      letter-spacing: -0.03em;
    }

    .eng { color: #f28c28; }
    .con { color: #3fb27f; }

    .joke {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 1.6vw, 1.3rem);
      font-style: italic;
      color: #9a9aa5;
    }

    .story {
      margin: 3rem auto 0;
      max-width: 660px;
      font-size: clamp(0.95rem, 1.3vw, 1.1rem);
      line-height: 1.7;
      color: #c8c8d0;
    }

    .story p + p { margin-top: 1.1rem; }

    .stats {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      gap: 3.5rem;
      flex-wrap: wrap;
    }

    .stat strong {
      display: block;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .stat span {
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8a8a94;
    }

    .soon {
      margin-top: 3.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #5c5c66;
    }

    @media (min-width: 900px) {
      h1 .line { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <main>
    <h1>
      <span class="line">In a room full of consultants, I'll be the best <span class="eng">engineer</span>.</span>
      <span class="line">In a room full of engineers, I'll be the best <span class="con">consultant</span>.</span>
    </h1>

    <p class="Name">- <span Tanush Maloo ></span></p>

    <p class="soon">Full portfolio coming soon</p>
  </main>
</body>
</html>
